services:
  # CivicResolve Express + SQLite Backend API
  - type: web
    name: civicresolve-api
    runtime: node
    # NOTE FOR MUNICIPAL PRODUCTION:
    # Render Free tier web services use ephemeral storage: all local SQLite database changes
    # are erased when the instance spins down or is redeployed.
    #
    # OPTION A (Recommended for SQLite on Render):
    # Change plan to 'starter' ($7/mo) and enable the persistent disk below.
    # The server automatically detects DATA_DIR=/var/data, initialises the database from
    # the repo baseline, and persists all genuine complaints and citizen profiles across restarts.
    #
    # OPTION B (Zero-cost Free Tier persistence):
    # Use Render's free managed PostgreSQL service or Turso (cloud SQLite/libsql), setting
    # DATABASE_URL in the environment variables.
    plan: starter
    disk:
      name: civicresolve-data
      mountPath: /var/data
      sizeGB: 1
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: FRONTEND_URL
        value: https://civicresolve-yc9v.onrender.com
      - key: CORS_ORIGIN
        value: https://civicresolve-yc9v.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

  # CivicResolve React + Vite Frontend
  - type: static
    name: civicresolve-frontend
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://civicresolve-8nve.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
