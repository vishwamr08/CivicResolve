services:
  # CivicResolve Express + SQLite Backend API
  - type: web
    name: civicresolve-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://civicresolve-yc9v.onrender.com
      - key: CORS_ORIGIN
        value: https://civicresolve-yc9v.onrender.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

  # CivicResolve React + Vite Frontend
  - type: static
    name: civicresolve-frontend
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://civicresolve-8nve.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
